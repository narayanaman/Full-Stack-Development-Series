<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aman - Table</title>
</head>
<body>
    <table border="black">
        <caption>Food_Menu</caption>

        <!-- Table Header  -->
        <thead>
        <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Price</th>

        </tr>
        <tr>
            <th>INR</th>
            <th>USD</th>
        </tr>

        </thead>
        <!-- Table Body  -->
        <tbody>

            <tr>
            <td>Samosa</td>
            <td>Rs.8</td>
            <td>$0.12</td>
        </tr>

        <tr>
            <td>Pasta</td>
            <td>Rs.120</td>
            <td>$1.50</td>
        </tr>

        <tr>
            
            <td>Pizza</td>
            <td>Rs.230</td>
            <td>$2.30</td>
        </tr>

        <tr>
            
            <td>French Fries</td>
            <td>Rs.50</td>
            <td>$0.50</td>
        </tr>
        </tbody>
        

    </table>
</body>
</html>
