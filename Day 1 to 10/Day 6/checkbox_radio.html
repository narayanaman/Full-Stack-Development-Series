<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox-Radio</title>
</head>
<body>
    <div>
        Gender :
        <br>
    <input type="radio" id="male" name="gen"/>
    <label for="male">Male</label>
    <input type="radio" id="female" name="gen"/>
    <label for="female">female</label>
    <input type="radio" id="other" name="gen"/>
    <label for="other">other</label>
    </div>
    <hr>

    <div>
        Hobbies:
        <br>
        <label for="math">Math</label>
        <input type="checkbox" id="math" name="sub">
        <label for="Science">Science</label>
        <input type="checkbox" id="Science" name="sub">
        <label for="Computer">Computer</label>
        <input type="checkbox" id="Computer" name="sub">
        <label for="Music">Music</label>
        <input type="checkbox" id="Music" name="sub">
        <label for="Cricket">Cricket</label>
        <input type="checkbox" id="Cricket" name="sub">
        <label for="Football">Football</label>
        <input type="checkbox" id="Football" name="sub">

    </div>

<br>
    <div>
        <label for="pro">Choose Your Profession:</label>
        <select name="pro" id="pro">
            <option value="student">Student</option>
            <option value="developer">Developer</option>
            <option value="worker">Worker</option>
            <option value="teacher">Teacher</option>
            <option value="hod">HOD</option>
            <option value="wardarn">Wardarn</option>
        </select>


    </div>

    <div>
        <label for="feedback">Please Give your Feedback :</label>
        <textarea name="feedback" id="feedback" placeholder="Enetr Your Feedback" rows="10" cols="100"></textarea>
    </div>
</body>
</html>
