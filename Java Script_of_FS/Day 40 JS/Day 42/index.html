<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Animated Login</title>
</head>

<body>

  <div class="card">

    <input type="checkbox" id="toggle" class="toggle" />

    <div class="card-bg"></div>

    <!-- SIGNUP HERO -->
    <div class="hero signup">
      <h2>Welcome Back!</h2>

      <p>
        Sign in to review your latest updates and continue your journey.
      </p>

      <label for="toggle">SIGN IN</label>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form signup">

      <h2>Create Account</h2>

      <input type="text" placeholder="Full Name" />
      <input type="email" placeholder="Email Address" />
      <input type="password" placeholder="Password" />

      <button>Create Account</button>

    </div>

    <!-- SIGNIN HERO -->
    <div class="hero signin">

      <h2>Hey There!</h2>

      <p>
        Begin your journey by using this beautiful animated login UI.
      </p>

      <label for="toggle">SIGN UP</label>

    </div>

    <!-- SIGNIN FORM -->
    <div class="form signin">

      <h2>Sign In</h2>

      <input type="email" placeholder="Email Address" />
      <input type="password" placeholder="Password" />

      <button>Sign In</button>

    </div>

  </div>

</body>

</html>
