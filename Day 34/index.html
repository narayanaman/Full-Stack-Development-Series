<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Button</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container" role="group" aria-label="Basic example">
        <h2>Bootstrap Group Button</h2>
        <div class="btn-group">
    <button type="button" class="btn btn-outline-primary">Left</button>
  <button type="button" class="btn btn-outline-success">Middle</button>
  <button type="button" class="btn btn-outline-info">Right</button>          
        </div>
  <button type="button" class="btn btn-primary">Left</button>
  <button type="button" class="btn btn-primary">Middle</button>
  <button type="button" class="btn btn-primary">Right</button>
</div>
</body>
</html>
